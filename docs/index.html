<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QA Automation Interview Knowledge Base</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="База знаний для подготовки к собеседованиям Java QA Automation Engineer (Backend + Frontend)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Theme: Docsify Base -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="assets/custom.css">
  
  <!-- Initial theme detection to prevent flash -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem('DOCSIFY_THEME');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('dark');
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Theme Toggle Floating Button -->
  <div class="theme-switch-wrapper">
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Сменить тему оформления" title="Сменить тему оформления">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
      <span class="theme-label">Тема</span>
    </button>
  </div>

  <div id="app">Загрузка базы знаний...</div>

  <script>
    window.$docsify = {
      name: '🎯 QA Interview Hub',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      themeColor: '#3b82f6',
      
      // Full-text Search
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Поиск по базе знаний...',
        noData: 'Ничего не найдено 😞',
        depth: 4,
        hideOtherSidebarContent: false
      },
      
      // Copy Code
      copyCode: {
        buttonText: '📋 Скопировать',
        errorText: 'Ошибка',
        successText: 'Скопировано!'
      },
      
      // Pagination
      pagination: {
        previousText: '⬅️ Предыдущая тема',
        nextText: 'Следующая тема ➡️',
        crossChapter: true,
        crossChapterText: true,
      },
      
      // Custom Plugins / Hooks
      plugins: [
        function (hook, vm) {
          // Frontmatter parsing and badges generation
          hook.beforeEach(function (content) {
            var frontmatterMatch = content.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!frontmatterMatch) return content;
            
            var rawYaml = frontmatterMatch[1];
            var body = content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
            
            // Extract fields
            var title = (rawYaml.match(/title:\s*["']?([^"'\n\r]+)["']?/) || [])[1] || '';
            var category = (rawYaml.match(/category:\s*([^\s\n\r]+)/) || [])[1] || '';
            var difficulty = (rawYaml.match(/difficulty:\s*([^\s\n\r]+)/) || [])[1] || '';
            var frequency = (rawYaml.match(/frequency:\s*([^\s\n\r]+)/) || [])[1] || '';
            var confidence = (rawYaml.match(/confidence:\s*([^\s\n\r]+)/) || [])[1] || '';
            var date = (rawYaml.match(/(?:date|last_reviewed):\s*([^\s\n\r]+)/) || [])[1] || '';
            var company = (rawYaml.match(/company:\s*["']?([^"'\n\r]+)["']?/) || [])[1] || '';
            
            // Interpolate frontmatter variables in body
            if (title) body = body.replace(/{{\s*title\s*}}/g, title);
            if (company) body = body.replace(/{{\s*company\s*}}/g, company);
            if (date) body = body.replace(/{{\s*date\s*}}/g, date);
            if (category) body = body.replace(/{{\s*category\s*}}/g, category);
            
            // Extract tags
            var tags = [];
            var tagSection = rawYaml.match(/tags:\r?\n((?:\s*-\s*[^\r\n]+\r?\n?)*)/);
            if (tagSection && tagSection[1]) {
              tags = tagSection[1].split('\n')
                .map(function(line) { return line.replace(/^\s*-\s*/, '').trim(); })
                .filter(function(t) { return t.length > 0; });
            }
            
            // Build Badges HTML
            var badgesHtml = '<div class="article-meta-card">';
            
            if (category) {
              badgesHtml += '<span class="badge badge-category">📁 ' + category + '</span>';
            }
            if (difficulty) {
              var diffClass = difficulty === 'easy' ? 'badge-easy' : (difficulty === 'hard' ? 'badge-hard' : 'badge-medium');
              var diffIcon = difficulty === 'easy' ? '🟢 Easy' : (difficulty === 'hard' ? '🔴 Hard' : '🟡 Medium');
              badgesHtml += '<span class="badge ' + diffClass + '">Сложность: ' + diffIcon + '</span>';
            }
            if (frequency) {
              var freqClass = frequency === 'high' ? 'badge-high' : (frequency === 'medium' ? 'badge-freq-med' : 'badge-freq-low');
              var freqIcon = frequency === 'high' ? '🔥 Часто' : (frequency === 'medium' ? '⚡ Средне' : '🔹 Редко');
              badgesHtml += '<span class="badge ' + freqClass + '">Частота: ' + freqIcon + '</span>';
            }
            if (confidence) {
              var stars = '⭐'.repeat(parseInt(confidence, 10) || 0);
              badgesHtml += '<span class="badge badge-confidence">Уверенность: ' + stars + ' (' + confidence + '/5)</span>';
            }
            if (date) {
              badgesHtml += '<span class="badge badge-date">📅 ' + date + '</span>';
            }
            
            if (tags.length > 0) {
              badgesHtml += '<div class="meta-tags-container">';
              tags.forEach(function(tag) {
                badgesHtml += '<span class="badge badge-tag">#' + tag + '</span>';
              });
              badgesHtml += '</div>';
            }
            
            badgesHtml += '</div>\n\n';
            
            return badgesHtml + body;
          });
          
          // Hook after markdown rendering for Callouts & Styling enhancements
          hook.afterEach(function (html, next) {
            // Transform TL;DR / Quick Summary heading into callout card
            html = html.replace(
              /<h3[^>]*>(?:⚡|✨)?\s*(?:Краткий ответ|Краткая выжимка|Суть ответа)\s*(?:\([^\)]*\))?<\/h3>([\s\S]*?)(?=<hr|<h2|<h3|$)/gi,
              function(match, p1) {
                return '<div class="callout callout-tldr"><div class="callout-header"><span class="callout-icon">⚡</span> Краткая выжимка (TL;DR — суть ответа за 30 секунд)</div><div class="callout-content">' + p1 + '</div></div>';
              }
            );

            // Transform Tricky questions heading into callout card
            html = html.replace(
              /<h3[^>]*>(?:🔥|💡|🎯)?\s*(?:Дополнительные\/каверзные|Каверзные)\s*вопросы[^<]*<\/h3>([\s\S]*?)(?=<hr|<h2|<h3|$)/gi,
              function(match, p1) {
                return '<div class="callout callout-tricky"><div class="callout-header"><span class="callout-icon">🔥</span> Каверзные вопросы на собеседовании</div><div class="callout-content">' + p1 + '</div></div>';
              }
            );

            // Transform Related tasks heading into callout card
            html = html.replace(
              /<h3[^>]*>(?:🔗|📌)?\s*Связанные\s*(?:материалы|задачи)[^<]*<\/h3>([\s\S]*?)(?=<hr|<h2|<h3|$)/gi,
              function(match, p1) {
                return '<div class="callout callout-links"><div class="callout-header"><span class="callout-icon">🔗</span> Связанные задачи и материалы</div><div class="callout-content">' + p1 + '</div></div>';
              }
            );

            next(html);
          });
        }
      ]
    };

    // Dark Mode Switcher Functionality
    function toggleDarkMode() {
      var isDark = document.documentElement.classList.toggle('dark');
      document.body.classList.toggle('dark', isDark);
      localStorage.setItem('DOCSIFY_THEME', isDark ? 'dark' : 'light');
    }

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.addEventListener('click', toggleDarkMode);
      }
    });
  </script>

  <!-- Docsify Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-properties.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
